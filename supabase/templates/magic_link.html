<!-- Sign-in email for returning users. The link opens /auth/confirm, which only
     signs in when the button there is pressed, so mail scanners can't use up
     the token. Paste into Supabase dashboard > Authentication > Emails > Magic Link. -->
<h2>Sign in to the PRISM CSS dashboard</h2>
<p>Click the link below to sign in:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Sign in to the dashboard</a></p>
<p>Or enter this code on the sign-in page:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
<p>The link and code expire in one hour. If you didn't ask to sign in, you can ignore this email.</p>
